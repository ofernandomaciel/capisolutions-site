services:
  site:
    build:
      context: .
    init: true
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_AUTH: "false"
      CONTACT_FROM_EMAIL: contato@capisolutions.local
      CONTACT_TO_EMAIL: contato@capisolutions.com
    ports:
      - "3000:3000"
    depends_on:
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 10
